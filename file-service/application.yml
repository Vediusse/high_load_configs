spring:
  datasource:
    url: ${FILE_DB_URL:jdbc:postgresql://file-postgres:5432/files}
    username: ${FILE_DB_USER:files}
    password: ${FILE_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  jdbc:
    template:
      query-timeout: 5s
  flyway:
    enabled: true
    validate-migration-naming: true
  webflux:
    multipart:
      max-in-memory-size: 64KB
      max-disk-usage-per-part: ${FILE_MAX_BYTES:10485760}B
      max-parts: 3
  cloud:
    openfeign:
      client:
        config:
          order-service:
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: none
files:
  max-bytes: 2048
  allowed-mime-types: ${FILE_ALLOWED_MIME_TYPES:application/pdf,image/png,image/jpeg}
  hard-max-bytes: 10485760
  legacy-directory: ${FILE_LEGACY_DIRECTORY:}
  s3:
    endpoint: ${S3_ENDPOINT:http://s3-storage:9000}
    region: us-east-1
    bucket: ${S3_BUCKET:order-files}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
catering:
  events:
    enabled: true
  blocking:
    threads: 4
    queue-capacity: 16
