spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s
          routes:
            - id: file-api
              uri: lb://file-service
              predicates:
                - Path=/api/v1/files,/api/v1/files/**,/api/v1/orders/{id}/files
            - id: file-docs
              uri: lb://file-service
              predicates:
                - Path=/v3/api-docs/files
              filters:
                - SetPath=/v3/api-docs
            - id: notification-api
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**
            - id: notification-docs
              uri: lb://notification-service
              predicates:
                - Path=/v3/api-docs/notifications
              filters:
                - SetPath=/v3/api-docs
            - id: identity-api
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/me
            - id: identity-docs
              uri: lb://identity-service
              predicates:
                - Path=/v3/api-docs/identity
              filters:
                - SetPath=/v3/api-docs
            - id: kitchen-commands
              uri: lb://kitchen-service
              predicates:
                - Path=/api/v1/orders/{id}/start-cooking,/api/v1/orders/{id}/mark-ready,/api/v1/orders/{id}/complete
            - id: kitchen-docs
              uri: lb://kitchen-service
              predicates:
                - Path=/v3/api-docs/kitchen
              filters:
                - SetPath=/v3/api-docs
            - id: catalog-api
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/categories/**,/api/v1/dishes/**
            - id: catalog-docs
              uri: lb://catalog-service
              predicates:
                - Path=/v3/api-docs/catalog
              filters:
                - SetPath=/v3/api-docs
            - id: order-service-api
              uri: lb://order-service
              predicates:
                - Path=/api/v1/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
