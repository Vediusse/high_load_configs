server:
  port: 8080
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  configuration:
    source: config-service
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

---
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        request.timeout.ms: 1000
        delivery.timeout.ms: 4000
        max.block.ms: 1000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 20
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        metadata.max.age.ms: 10000
        default.api.timeout.ms: 5000
        request.timeout.ms: 5000
logging:
  level:
    org.apache.kafka: WARN

---
spring:
  cloud:
    bus:
      enabled: ${CONFIG_BUS_ENABLED:false}
      destination: runtime-config-events
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
          auto-create-topics: false
          auto-add-partitions: false
          replication-factor: 3
          producer-properties:
            acks: all
            enable.idempotence: true
          consumer-properties:
            session.timeout.ms: 10000
            heartbeat.interval.ms: 3000
            metadata.max.age.ms: 10000
